version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"
