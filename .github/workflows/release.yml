name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile

      - name: frontend をビルドする
        run: bun run build

      # フロントとマイグレーションを埋め込んだ単体バイナリを、OS ごとに作る
      - name: judgineer を OS ごとの単体バイナリにする
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/build-binary.ts --version "$TAG"

      - name: リリースに添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: dist-bin
        run: |
          sha256sum judgineer-* > SHA256SUMS
          gh release upload "$TAG" judgineer-* SHA256SUMS --clobber
